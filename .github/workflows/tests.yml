name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install . pytest
      - name: Tests
        run: python -m pytest -q
      - name: Draw the 15 example molecules with the command
        run: smiles2pptx --file examples/molecules.txt -o molecules.pptx
      - uses: actions/upload-artifact@v7
        with:
          name: molecules-${{ matrix.os }}-py${{ matrix.python }}
          path: molecules.pptx
